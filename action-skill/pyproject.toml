[project]
name = "clawd-reachy-mini-skill"
version = "0.1.0"
description = "OpenClaw skill manifest for Reachy Mini robot integration"
requires-python = ">=3.10"
# Tool calls are dispatched over the OpenClaw gateway to the bridge process on
# the dedicated Reachy host, so this side ships only the skill manifest.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["SKILL.md"]

[tool.hatch.build.targets.wheel.sources]
"" = "clawd_reachy_mini_skill"
